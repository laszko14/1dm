name: Verify tab-group core
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test group manager and build core jar
        run: bash scripts/test.sh
      - name: Upload library for internal test only
        uses: actions/upload-artifact@v4
        with:
          name: tab-groups-core
          path: build/tab-groups-core.jar
